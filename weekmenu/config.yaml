name: Weekmenu AH
version: "0.4.0"
slug: weekmenu
description: Weekmenu rond de AH-bonus, met de boodschappen in je bestelling of op Mijn lijst
url: https://github.com/antotl1997/ha-weekmenu
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:food
panel_title: Weekmenu
stdin: true
homeassistant_api: true
options:
  schedule_time: "08:00"
  pantry:
    - olie
    - zout
    - peper
    - suiker
    - bloem
    - azijn
schema:
  schedule_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  pantry:
    - str
