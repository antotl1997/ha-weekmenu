[project]
name = "weekmenu"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "aiohttp>=3.14.5", "pyyaml>=6.0.3", "tzdata>=2026.6", "recipe-scrapers>=15.13.0"]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-asyncio>=1.4", "respx>=0.23", "pytest-aiohttp>=1.1", "pip-audit>=2.10", "Pillow>=13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: a real headless Chrome or wall-clock timing (runs by default; deselect with -m \"not slow\")",
]
