[project]
name = "weekmenu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "aiohttp>=3.9", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pytest-aiohttp>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
