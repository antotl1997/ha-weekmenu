[project]
name = "weekmenu"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "aiohttp>=3.9", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pytest-aiohttp>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: drives a real headless Chrome (runs by default; deselect with -m \"not slow\")",
]
